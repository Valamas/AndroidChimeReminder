<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reminders By Valamas - Feature Graphic</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .feature-graphic {
            width: 1024px;
            height: 500px;
            background: linear-gradient(135deg, #ffffff 0%, #f8f8f8 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 80px;
            overflow: hidden;
        }

        .icon-section {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-icon {
            width: 220px;
            height: 220px;
            background: white;
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 20px;
        }

        .text-section {
            flex: 1;
            margin-left: 80px;
        }

        .app-name {
            font-size: 56px;
            font-weight: 800;
            color: #1a1a1a;
            line-height: 0.95;
            margin-bottom: 12px;
            letter-spacing: -0.8px;
        }

        .app-name-by {
            font-size: 28px;
            color: #666;
            font-weight: 600;
            display: block;
            margin-top: -2px;
        }

        .tagline {
            font-size: 26px;
            font-weight: 500;
            color: #9c0000;
            line-height: 1.3;
            max-width: 400px;
            margin-bottom: 16px;
        }

        .subtitle {
            font-size: 18px;
            color: #666;
            font-weight: 400;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="feature-graphic">
        <!-- Icon -->
        <div class="icon-section">
            <div class="app-icon">
                <img src="timer-512.png" alt="Reminders By Valamas">
            </div>
        </div>

        <!-- Text -->
        <div class="text-section">
            <div class="app-name">Reminders<br><span class="app-name-by">By Valamas</span></div>
            <div class="tagline">Minimal chime reminders.<br>No distractions.</div>
            <div class="subtitle">Just a chime when you need it.</div>
        </div>
    </div>
</body>
</html>
